[project]
name = "hpvpinn-capillarity"
version = "2.0.0.dev0"
description = "hp-VPINN framework for inverse hydraulic parameter recovery in unsaturated porous media"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.13"
dependencies = [
    "jax>=0.9.0",
    "jaxlib>=0.9.0",
    "flax>=0.12.2",
    "optax>=0.2.6",
    "equinox>=0.13.2",
    "jaxtyping>=0.3.5",
    "orbax-checkpoint>=0.11.32",
    "torch==2.10.0+cpu",
    "torchvision==0.25.0+cpu",
    "torchaudio==2.10.0+cpu",
    "matplotlib>=3.10.8",
    "numpy>=2.3.5",
    "scipy>=1.17.0",
    "rich>=14.3.0",
    "jaxopt>=0.8.5",
    "optuna>=4.7.0",
    "optuna-dashboard>=0.20.0",
    "plotly>=6.6.0",
    "pandas>=3.0.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
