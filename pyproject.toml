[project]
name = "hpvpinn-capillarity"
version = "2.0.0"
description = "hp-VPINN framework for inverse hydraulic parameter recovery in unsaturated porous media"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "jax>=0.9.0",
    "jaxlib>=0.9.0",
    "optax>=0.2.6",
    "equinox>=0.13.2",
    "matplotlib>=3.10.8",
    "numpy>=2.3.5",
    "scipy>=1.17.0",
    "jaxopt>=0.8.5",
    "optuna>=4.7.0",
    "pandas>=3.0.1",
]

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
